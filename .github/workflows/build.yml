name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check manifest versions agree
        # The release job only validates at tag time. Catching drift here means a
        # forgotten bump fails on the PR instead of a failed release.
        run: |
          fail=0
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"
          cargo="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          cargo_lock="$(grep -A1 -m1 '^name = "osint-case-manager"$' src-tauri/Cargo.lock | sed -nE 's/^version = "(.*)"$/\1/p')"

          check() {
            local file="$1" actual="$2"
            if [[ "$actual" != "$pkg" ]]; then
              echo "::error file=$file::version is '$actual' but package.json says '$pkg'"
              fail=1
            fi
          }
          check src-tauri/tauri.conf.json "$conf"
          check package-lock.json "$lock"
          check src-tauri/Cargo.toml "$cargo"
          check src-tauri/Cargo.lock "$cargo_lock"

          echo "All manifests at $pkg"
          exit $fail

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  tauri:
    name: Tauri build (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Builds the real installers, so a broken bundle config fails here rather
      # than at release time.
      - name: Build bundles
        run: npm run tauri:build

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
