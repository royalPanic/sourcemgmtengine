[package]
name = "osint-case-manager"
version = "3.0.0"
description = "OSINT Case & Source Manager"
authors = ["OSINT Case Manager Team"]
edition = "2021"

[lib]
name = "osint_case_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
glob = "0.3.4"
# Needed to drive async sqlx tests; the app itself gets tokio via tauri.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

# These lower bounds are the tested API versions. Cargo.lock pins the exact
# versions for app builds, while the manifest permits compatible updates.
[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
which = "6.0.3"
sha2 = "0.10.9"
hex = "0.4.3"
ureq = "2.12.1"
url = "2.5.8"
sha1 = "0.10.7"
sha3 = "0.10.9"
ripemd = "0.1.3"
